<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>HidePeriodicalItems Static Add-On Preview</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      body {
        font-family: Segoe UI, Arial, sans-serif;
        margin: 24px;
      }

      nde-location-items-container {
        display: block;
        max-width: 720px;
        margin-bottom: 16px;
        padding: 16px;
        border: 1px solid #d0d7de;
      }
    </style>
  </head>
  <body>
    <h1>HidePeriodicalItems Preview</h1>
    <nde-location-items-container id="current">
      <strong>Current Periodicals</strong>
    </nde-location-items-container>
    <nde-location-items-container id="stacks">
      <strong>Main Stacks</strong>
    </nde-location-items-container>

    <script type="module">
      import { bootstrapRemoteApp } from './src/bootstrap.js';

      const runtime = await bootstrapRemoteApp({
        settings: {
          debug: true,
          locationMatchers: ['current periodicals']
        }
      });
      const ctor = runtime.instance.getComponentRef('nde-location-items-container-after');
      const tagName = 'preview-hide-periodical-items-element';
      customElements.define(tagName, ctor);

      const current = document.getElementById('current');
      const currentElement = document.createElement(tagName);
      currentElement.hostComponent = {
        location: {
          displayName: 'Current Periodicals'
        }
      };
      current.appendChild(currentElement);

      const stacks = document.getElementById('stacks');
      const stacksElement = document.createElement(tagName);
      stacksElement.hostComponent = {
        location: {
          displayName: 'Main Stacks'
        }
      };
      stacks.appendChild(stacksElement);
    </script>
  </body>
</html>
